[project]
name = "cis-ai-service"
version = "0.1.0"
description = "CIS (Climate Immune System / ClimaResonance) AI Service - decision support for climate misinformation detection, narrative risk mapping, and inoculation drafting"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.5.0",
    "sqlalchemy>=2.0.30",
    "asyncpg>=0.29.0",
    "pgvector>=0.3.0",
    "sentence-transformers>=3.0.0",
    "scikit-learn>=1.5.0",
    "hdbscan>=0.8.38",
    "numpy>=1.26.0",
    "scipy>=1.13.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.9",
    "openai>=1.60.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff.lint]
# B008: FastAPI's Depends()/Query() default-argument pattern is idiomatic, not a bug.
# ISC004: demo seed data intentionally wraps long literal post text across lines.
ignore = ["B008", "ISC004"]

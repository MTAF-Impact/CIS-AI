[project]
name = "cis-ai-service"
version = "0.1.0"
description = "CIS (Climate Immune System / ClimaResonance) AI Service - decision support for climate misinformation detection, narrative risk mapping, and inoculation drafting"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.5.0",
    "sqlalchemy>=2.0.30",
    "asyncpg>=0.29.0",
    "pgvector>=0.3.0",
    "sentence-transformers>=3.0.0",
    "scikit-learn>=1.5.0",
    "hdbscan>=0.8.38",
    "numpy>=1.26.0",
    "scipy>=1.13.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.9",
    "openai>=1.60.0",
    "torch>=2.0.0",
    "pypdf>=6.16.2",
    "python-docx>=1.2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.0",
]
crawler = [
    "feedparser>=6.0.0",
    "telethon>=1.36.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# We only ever run embeddings on CPU (no GPU in this service or its Cloud Run target), but
# torch's default PyPI wheels bundle full CUDA/nvidia-* libraries on Linux regardless -
# pointing it at PyTorch's CPU-only wheel index avoids ~9GB of unused CUDA deps in the image.
[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff.lint]
# B008: FastAPI's Depends()/Query() default-argument pattern is idiomatic, not a bug.
# ISC004: demo seed data intentionally wraps long literal post text across lines.
ignore = ["B008", "ISC004"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Session-scoped loop: our test_engine/real_embedder fixtures are session-scoped for
# performance (one model load, one connection pool for the whole run). asyncpg connections
# are bound to the event loop they were created in, so a function-scoped default loop here
# would silently corrupt connection state across tests ("another operation is in progress").
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = [
    "integration: requires a live Postgres+pgvector database (TEST_DATABASE_URL)",
]

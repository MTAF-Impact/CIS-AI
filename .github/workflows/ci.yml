name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

# Cancel superseded runs on the same branch/PR to avoid wasting CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/postgres

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install 3.11

      # sentence-transformers/all-MiniLM-L6-v2 (~90MB) is downloaded once here and cached
      # across runs - keeps the real_embedder test fixture fast and avoids hammering HF Hub.
      - name: Cache Hugging Face model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-minilm-l6-v2-${{ runner.os }}

      - name: Install dependencies
        run: uv sync --frozen --all-groups

      - name: Lint (ruff)
        run: uv run ruff check app tests scripts crawler

      - name: Run tests
        run: uv run pytest -v

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build-only (no push) - validates the image stays deployable ahead of the
      # planned Cloud Run rollout, without needing any registry credentials yet.
      # The crawler ships inside this same image now (see docs/CRAWLER.md), so
      # there's no separate Dockerfile.crawler to build here anymore.
      - name: Build service image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: cis-ai-service:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
